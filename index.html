<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Estacionamento</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.4rem;
            margin-bottom: 8px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        header p {
            opacity: 0.9;
            font-size: 1.1rem;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        .stat-card h3 {
            font-size: 0.95rem;
            color: #666;
            margin-bottom: 8px;
        }

        .stat-card .number {
            font-size: 2.2rem;
            font-weight: 700;
        }

        .stat-card.total .number { color: #2a5298; }
        .stat-card.livre .number { color: #28a745; }
        .stat-card.ocupada .number { color: #dc3545; }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 25px;
        }

        @media (max-width: 900px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }

        .parking-area, .controls {
            background: white;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.12);
        }

        .parking-area h2, .controls h2 {
            margin-bottom: 20px;
            color: #1e3c72;
            font-size: 1.3rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
            gap: 12px;
        }

        .spot {
            aspect-ratio: 1;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            border: 3px solid transparent;
            position: relative;
            font-size: 0.95rem;
        }

        .spot.livre {
            background: #d4edda;
            color: #155724;
            border-color: #28a745;
        }

        .spot.ocupada {
            background: #f8d7da;
            color: #721c24;
            border-color: #dc3545;
        }

        .spot:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }

        .spot.selected {
            border-color: #ffc107;
            box-shadow: 0 0 0 3px rgba(255, 193, 7, 0.4);
        }

        .spot .placa {
            font-size: 0.75rem;
            margin-top: 4px;
            font-weight: 500;
            max-width: 80px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #444;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #2a5298;
        }

        .btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 10px;
        }

        .btn-park {
            background: #28a745;
            color: white;
        }

        .btn-park:hover {
            background: #218838;
        }

        .btn-exit {
            background: #dc3545;
            color: white;
        }

        .btn-exit:hover {
            background: #c82333;
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .info {
            background: #e9f0ff;
            border-radius: 8px;
            padding: 12px;
            font-size: 0.9rem;
            color: #1e3c72;
            margin-top: 15px;
        }

        .historico {
            margin-top: 25px;
            max-height: 220px;
            overflow-y: auto;
        }

        .historico h3 {
            margin-bottom: 12px;
            color: #1e3c72;
        }

        .log-item {
            background: #f8f9fa;
            padding: 10px 12px;
            border-radius: 6px;
            margin-bottom: 8px;
            font-size: 0.88rem;
            border-left: 4px solid #2a5298;
        }

        .log-item.entrada { border-left-color: #28a745; }
        .log-item.saida { border-left-color: #dc3545; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🅿️ Sistema de Estacionamento</h1>
            <p>Gerencie as vagas de forma simples e rápida</p>
        </header>

        <div class="stats">
            <div class="stat-card total">
                <h3>Total de Vagas</h3>
                <div class="number" id="total">20</div>
            </div>
            <div class="stat-card livre">
                <h3>Vagas Livres</h3>
                <div class="number" id="livres">20</div>
            </div>
            <div class="stat-card ocupada">
                <h3>Vagas Ocupadas</h3>
                <div class="number" id="ocupadas">0</div>
            </div>
        </div>

        <div class="main-content">
            <!-- Grade de Vagas -->
            <div class="parking-area">
                <h2>Mapa de Vagas</h2>
                <div class="grid" id="grid"></div>
            </div>

            <!-- Controles -->
            <div class="controls">
                <h2>Controles</h2>

                <div class="form-group">
                    <label for="placa">Placa do Veículo</label>
                    <input type="text" id="placa" placeholder="Ex: ABC1D23" maxlength="8">
                </div>

                <button class="btn btn-park" id="btnPark" onclick="estacionar()">Estacionar</button>
                <button class="btn btn-exit" id="btnExit" onclick="liberar()" disabled>Liberar Vaga</button>

                <div class="info" id="info">
                    Clique em uma vaga livre ou preencha a placa e clique em <strong>Estacionar</strong>.
                </div>

                <div class="historico">
                    <h3>Histórico</h3>
                    <div id="logs"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Configuração
        const TOTAL_VAGAS = 20;
        let vagas = [];
        let vagaSelecionada = null;

        // Inicializa as vagas
        function init() {
            for (let i = 1; i <= TOTAL_VAGAS; i++) {
                vagas.push({
                    numero: i,
                    ocupada: false,
                    placa: null,
                    entrada: null
                });
            }
            renderGrid();
            atualizarStats();
        }

        // Renderiza a grade
        function renderGrid() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';

            vagas.forEach(vaga => {
                const div = document.createElement('div');
                div.className = `spot ${vaga.ocupada ? 'ocupada' : 'livre'}`;
                if (vagaSelecionada === vaga.numero) {
                    div.classList.add('selected');
                }

                div.innerHTML = `
                    <span>V${vaga.numero.toString().padStart(2, '0')}</span>
                    ${vaga.ocupada ? `<span class="placa">${vaga.placa}</span>` : ''}
                `;

                div.onclick = () => selecionarVaga(vaga.numero);
                grid.appendChild(div);
            });
        }

        // Seleciona uma vaga
        function selecionarVaga(numero) {
            vagaSelecionada = numero;
            renderGrid();

            const vaga = vagas.find(v => v.numero === numero);
            const btnExit = document.getElementById('btnExit');
            const info = document.getElementById('info');

            if (vaga.ocupada) {
                btnExit.disabled = false;
                info.innerHTML = `Vaga <strong>V${numero.toString().padStart(2, '0')}</strong> ocupada por <strong>${vaga.placa}</strong>. Clique em <strong>Liberar Vaga</strong>.`;
            } else {
                btnExit.disabled = true;
                info.innerHTML = `Vaga <strong>V${numero.toString().padStart(2, '0')}</strong> selecionada. Preencha a placa e clique em <strong>Estacionar</strong>.`;
            }
        }

        // Estacionar veículo
        function estacionar() {
            const placaInput = document.getElementById('placa');
            let placa = placaInput.value.trim().toUpperCase();

            if (!placa) {
                alert('Digite a placa do veículo!');
                placaInput.focus();
                return;
            }

            // Validação simples de placa
            if (placa.length < 7) {
                alert('Placa inválida! Use o formato ABC1D23 ou ABC-1234');
                return;
            }

            // Verifica se a placa já está estacionada
            const jaEstacionado = vagas.find(v => v.ocupada && v.placa === placa);
            if (jaEstacionado) {
                alert(`O veículo ${placa} já está estacionado na vaga V${jaEstacionado.numero.toString().padStart(2, '0')}!`);
                return;
            }

            let vaga;

            if (vagaSelecionada) {
                vaga = vagas.find(v => v.numero === vagaSelecionada);
                if (vaga.ocupada) {
                    alert('Esta vaga já está ocupada!');
                    return;
                }
            } else {
                // Encontra a primeira vaga livre
                vaga = vagas.find(v => !v.ocupada);
                if (!vaga) {
                    alert('Estacionamento lotado!');
                    return;
                }
            }

            // Ocupa a vaga
            vaga.ocupada = true;
            vaga.placa = placa;
            vaga.entrada = new Date();

            // Limpa campos
            placaInput.value = '';
            vagaSelecionada = null;
            document.getElementById('btnExit').disabled = true;

            renderGrid();
            atualizarStats();
            adicionarLog('entrada', `Veículo ${placa} estacionado na vaga V${vaga.numero.toString().padStart(2, '0')}`);

            document.getElementById('info').innerHTML = `Veículo <strong>${placa}</strong> estacionado com sucesso na vaga <strong>V${vaga.numero.toString().padStart(2, '0')}</strong>!`;
        }

        // Liberar vaga
        function liberar() {
            if (!vagaSelecionada) return;

            const vaga = vagas.find(v => v.numero === vagaSelecionada);
            if (!vaga || !vaga.ocupada) return;

            const placa = vaga.placa;
            const tempo = calcularTempo(vaga.entrada);

            vaga.ocupada = false;
            vaga.placa = null;
            vaga.entrada = null;

            vagaSelecionada = null;
            document.getElementById('btnExit').disabled = true;

            renderGrid();
            atualizarStats();
            adicionarLog('saida', `Veículo ${placa} saiu da vaga V${vaga.numero.toString().padStart(2, '0')} (tempo: ${tempo})`);

            document.getElementById('info').innerHTML = `Vaga <strong>V${vaga.numero.toString().padStart(2, '0')}</strong> liberada. Veículo <strong>${placa}</strong> permaneceu ${tempo}.`;
        }

        // Calcula tempo de permanência
        function calcularTempo(entrada) {
            const agora = new Date();
            const diff = Math.floor((agora - entrada) / 1000); // em segundos

            if (diff < 60) return `${diff}s`;
            if (diff < 3600) return `${Math.floor(diff / 60)}min`;
            const horas = Math.floor(diff / 3600);
            const minutos = Math.floor((diff % 3600) / 60);
            return `${horas}h ${minutos}min`;
        }

        // Atualiza contadores
        function atualizarStats() {
            const ocupadas = vagas.filter(v => v.ocupada).length;
            document.getElementById('livres').textContent = TOTAL_VAGAS - ocupadas;
            document.getElementById('ocupadas').textContent = ocupadas;
        }

        // Adiciona log no histórico
        function adicionarLog(tipo, mensagem) {
            const logs = document.getElementById('logs');
            const agora = new Date().toLocaleTimeString('pt-BR');

            const item = document.createElement('div');
            item.className = `log-item ${tipo}`;
            item.innerHTML = `<strong>${agora}</strong> — ${mensagem}`;

            logs.insertBefore(item, logs.firstChild);

            // Limita a 15 logs
            if (logs.children.length > 15) {
                logs.removeChild(logs.lastChild);
            }
        }

        // Inicia o sistema
        init();
    </script>
</body>
</html>
